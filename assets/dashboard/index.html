<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Render Pipeline</title><style>
:root{color-scheme:light;--paper:#eef1ed;--ink:#18231f;--muted:#69746f;--green:#477864;--violet:#28263b;--line:#ccd3ce}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px system-ui,sans-serif}main{max-width:1260px;margin:auto;padding:32px}header,.row,.card-head{display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--green)}h1{font-size:30px;margin:6px 0}.live{color:var(--green)}.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;margin-top:24px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}.wide{grid-column:span 2}.value{font-size:32px;font-weight:650;margin:12px 0}.muted,.label{color:var(--muted);font-size:12px}.track{height:8px;background:#dfe5e1;border-radius:8px;overflow:hidden}.fill{height:100%;background:var(--green);width:0}.pairs{display:grid;gap:9px}.pair{display:flex;justify-content:space-between;border-top:1px solid #e8ebe9;padding-top:8px}pre{white-space:pre-wrap;max-height:210px;overflow:auto;background:var(--violet);color:#e6ebe8;padding:14px;border-radius:9px}.outputs{word-break:break-all}@media(max-width:800px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}header{align-items:flex-start;flex-direction:column}}
</style></head><body><main><header><div><div class="eyebrow">CODEX RENDER PIPELINE / TELEMETRY</div><h1 id="title">Render delivery</h1><div class="muted" id="revision">等待状态</div></div><div class="live" id="fresh">连接中</div></header><section class="grid"><div class="card wide"><div class="card-head"><span class="label">PIPELINE STAGE</span><strong id="stage">—</strong></div><div class="value"><span id="percent">—</span>%</div><div class="track"><div class="fill" id="fill"></div></div><div class="row muted"><span id="count">—</span><span id="eta">—</span></div></div><div class="card"><div class="label">GPU</div><div class="value"><span id="gpu">—</span>%</div><div class="pairs"><div class="pair"><span>显存</span><span id="vram">—</span></div><div class="pair"><span>温度 / 功率</span><span id="thermal">—</span></div><div class="pair"><span>频率</span><span id="clock">—</span></div></div></div><div class="card"><div class="label">SYSTEM</div><div class="value"><span id="cpu">—</span>%</div><div class="pairs"><div class="pair"><span>内存</span><span id="ram">—</span></div><div class="pair"><span>磁盘可用</span><span id="disk">—</span></div><div class="pair"><span>原始帧</span><span id="bytes">—</span></div></div></div><div class="card wide"><div class="label">OUTPUTS</div><div class="outputs" id="outputs">尚未发布输出</div></div><div class="card"><div class="label">RECENT LOGS</div><pre id="logs">—</pre></div></section></main><script>
const $=id=>document.getElementById(id),num=(x,n=1)=>x==null?'—':Number(x).toFixed(n),bytes=x=>{if(x==null)return'—';let u=['B','KiB','MiB','GiB','TiB'],i=0;while(x>=1024&&i<u.length-1){x/=1024;i++}return num(x,i?2:0)+' '+u[i]},duration=s=>{if(s==null)return'ETA —';let h=Math.floor(s/3600),m=Math.floor(s%3600/60);return`ETA ${h}h ${m}m`};async function load(){try{let d=await fetch('/api/metrics',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}),p=d.progress||{},g=d.gpu||{},s=d.system||{},k=d.storage||{},o=d.output||{},st=d.status||{};$('title').textContent=o.project?.name||'Render delivery';$('revision').textContent=o.project?.revision||st.revision||'';$('stage').textContent=(d.phase||'idle').replaceAll('_',' ').toUpperCase();$('percent').textContent=num(p.percent,2);$('fill').style.width=Math.min(100,p.percent||0)+'%';$('count').textContent=`${p.complete||0} / ${p.total||0}`;$('eta').textContent=duration(p.eta_seconds);$('gpu').textContent=num(g.utilization,0);$('vram').textContent=`${num(g.memory_used_mib,0)} / ${num(g.memory_total_mib,0)} MiB`;$('thermal').textContent=`${num(g.temperature_c,0)} °C / ${num(g.power_w,0)} W`;$('clock').textContent=num(g.clock_mhz,0)+' MHz';$('cpu').textContent=num(s.cpu_percent,0);$('ram').textContent=`${bytes(s.ram_used_bytes)} / ${bytes(s.ram_total_bytes)}`;$('disk').textContent=bytes(k.free_bytes);$('bytes').textContent=bytes(k.frame_bytes);$('outputs').textContent=JSON.stringify(o.outputs||st.outputs||{},null,2);$('logs').textContent=(d.logs||[]).join('\n')||'—';$('fresh').textContent='LIVE · '+new Date(d.generated_at*1000).toLocaleTimeString()}catch(e){$('fresh').textContent='OFFLINE · '+e.message}}load();setInterval(load,5000)
</script></body></html>
